services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: boma
      POSTGRES_PASSWORD: boma_dev_password
      POSTGRES_DB: boma
    ports:
      - "5432:5432"
    volumes:
      - boma_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boma -d boma"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  boma_pgdata:
